[package]
name = "veloct-desktop"
description = "Veloct desktop application shell (Tauri 2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# Tauri 2 expects a library target so mobile and desktop can share the app setup.
name = "veloct_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
veloct-core = { workspace = true }
veloct-app = { workspace = true }
veloct-ai = { workspace = true }
veloct-content = { workspace = true }
veloct-logging = { workspace = true }
git2 = { workspace = true }
veloct-sidecar = { workspace = true }
veloct-git = { workspace = true }
veloct-release = { workspace = true }
veloct-storage = { workspace = true }
veloct-process = { workspace = true }
veloct-attach = { workspace = true }
rand = { workspace = true }
veloct-backup = { workspace = true }
veloct-deploy = { workspace = true }
veloct-markdown = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
keyring = { workspace = true }
parking_lot = { workspace = true }
tauri = { workspace = true }
tauri-plugin-shell = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-dialog = { workspace = true }

[dev-dependencies]
# `tauri/test` is enabled HERE and not in `[dependencies]` so that no release artifact links it: with
# resolver v2 a dev-dependency's features are unified only for a build that includes dev-dependencies, so
# `cargo build --release` still compiles tauri exactly as before. It is what lets a test build a real
# `App` on the mock runtime and hand `app.state::<AppState>()` to a command that takes `tauri::State`
# (PROCESSING.md §5.10.2 item 2).
tauri = { workspace = true, features = ["test"] }
tempfile = { workspace = true }
veloct-core = { workspace = true }
veloct-app = { workspace = true }
veloct-backup = { workspace = true }
veloct-git = { workspace = true }
git2 = { workspace = true }
veloct-sidecar = { workspace = true }
